spring.application.name=backend

# PostgreSQL connection. Values can be overridden with environment variables
# (the defaults are the ones used by TaskManager/docker-compose.yml).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:taskmanager}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway creates/updates the tables by running the SQL files
# located in src/main/resources/db/migration when the application starts.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# The schema is owned by Flyway: Hibernate only checks that it matches the entity.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true