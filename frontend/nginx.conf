server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The Angular app calls /api/tasks with a relative URL. Proxying here means
    # the browser only talks to one origin, so no CORS configuration is needed.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Angular routing: /tasks/1 is a client route and must return index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The Angular build adds a content hash to these file names (main-XXXX.js,
    # styles-XXXX.css), so a visitor only downloads them again if they change.
    location ~* ^/(main|styles|polyfills)-[A-Za-z0-9]+\.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}